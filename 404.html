<script>
/* GitHub Pages は存在しない URL すべてにこのページを返すため、/a/b/c のような深い階層でも
   画像・リンクが切れないよう、サイトの起点を base に設定する。
   ・<ユーザー名>.github.io/<リポジトリ名>/ … 先頭のパス（リポジトリ名）が起点
   ・独自ドメインや <ユーザー名>.github.io リポジトリ … ドメイン直下が起点 */
(function () {
  var seg = location.pathname.split('/')[1];
  var isProject = /\.github\.io$/i.test(location.hostname) && seg && !/\./.test(seg);
  var b = document.createElement('base');
  b.href = isProject ? '/' + seg + '/' : '/';
  document.head.appendChild(b);
})();
</script>
